name: desktop launches

on:
  push:
    branches: [main, 'feat/windows-desktop*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Ubuntu package indexes
        timeout-minutes: 3
        run: sudo bash tools/setup-linux-desktop.sh update
      - name: Desktop tools
        timeout-minutes: 7
        run: sudo bash tools/setup-linux-desktop.sh install
      - name: Build
        run: ./build.sh test
      - name: Window placement across restarts
        run: |
          python3 tests/linux-window-state.py
          python3 tests/x11-window-race.py
          python3 tests/wayland-window-state.py
      - name: Full editor tests
        shell: bash
        env:
          RHUN_TEST_ARTIFACTS: build/stabilization/linux
        run: tests/run.sh 2>&1 | tee build/editor-tests.log
      - name: Installer and download failures
        run: |
          sh tests/install.sh
          python3 tests/install-download.py
      - name: Native file launches
        run: |
          python3 tests/linux-launch.py
          python3 tests/linux-launch.py --wayland
      - name: Native wheel and touchpad scrolling
        run: |
          python3 tests/linux-scroll.py
          python3 tests/linux-scroll.py --wayland
      - name: Zoom from the keypad
        run: |
          python3 tests/linux-keypad.py
          python3 tests/linux-keypad.py --wayland
      - name: Input methods (issue 121)
        run: |
          python3 tests/linux-ime.py
          python3 tests/linux-ime.py --wayland
      - name: Window switches keep the editor's view
        run: |
          python3 tests/linux-focus.py
          python3 tests/linux-focus.py --wayland
      - name: System dark mode (portal, XSETTINGS, settings.ini)
        run: |
          python3 tests/linux-appearance.py
          python3 tests/linux-appearance.py --wayland
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-stabilization
          path: |
            build/editor-tests.log
            build/stabilization/

  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh test
      - name: Full editor tests and Finder launches
        shell: bash
        env:
          RHUN_TEST_ARTIFACTS: build/stabilization/macos
        run: tests/run.sh 2>&1 | tee build/editor-tests.log
      - name: Installer and download failures
        run: |
          sh tests/install.sh
          python3 tests/install-download.py
          python3 tests/mac-defaults.py
      - name: System dark mode
        env:
          RHUN_TEST_SYSTEM_APPEARANCE: '1'
        run: python3 tests/mac-appearance.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-stabilization
          path: |
            build/editor-tests.log
            build/stabilization/
