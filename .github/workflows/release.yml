# A version tag (tools/release.sh) builds, tests, signs and publishes rhun. The release is created as
# a draft and published last, so releases/latest never points at one without its files.
# Secrets: MACOS_CERT_P12, MACOS_CERT_PASSWORD (Developer ID Application certificate, base64 .p12)
# and APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER_ID (App Store Connect API key, base64 .p8).
# Every Mac release is notarized and stapled, and its ZIP and disk image pass Gatekeeper before upload.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The tag is VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils curl git python3 xvfb openbox xdotool x11-utils sway gcc pkg-config libwayland-dev wayland-protocols fonts-nanum fonts-droid-fallback
      - name: Tests
        run: tests/run.sh
      - name: Installer tests
        run: sh tests/install.sh
      - name: Native file launches (X11 and Wayland)
        run: |
          python3 tests/linux-launch.py
          python3 tests/linux-launch.py --wayland
      - name: Build
        run: RHUN_DIST=1 ./build.sh release
      - name: Pack
        run: |
          v=$(cat VERSION)
          r=stage/rhun-$v
          mkdir -p "$r/bin" "$r/share/applications" "$r/share/icons/hicolor/scalable/apps" \
            "$r/share/icons/hicolor/256x256/apps" "$r/share/icons/hicolor/512x512/apps"
          cp build/rhun "$r/bin/"
          cp assets/rhun.desktop "$r/share/applications/"
          cp assets/rhun-url-handler.desktop "$r/share/applications/"
          cp assets/icons/rhun.svg "$r/share/icons/hicolor/scalable/apps/"
          cp assets/icons/rhun-256.png "$r/share/icons/hicolor/256x256/apps/rhun.png"
          cp assets/icons/rhun-512.png "$r/share/icons/hicolor/512x512/apps/rhun.png"
          cp LICENSE "$r/"
          cp assets/licenses/LICENSE-Unicode.txt "$r/"
          test "$("$r/bin/rhun" --version)" = "rhun $v"
          tar -czf "rhun-$v-linux-x86_64.tar.gz" -C stage "rhun-$v"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: rhun-*-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: The tag is VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - name: Signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc=$RUNNER_TEMP/rhun.keychain-db
          kp=$(openssl rand -hex 24)
          printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kp" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kp" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kp" "$kc" >/dev/null
          # shellcheck disable=SC2046 # the search list, one keychain per word
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"
      - name: Tests
        run: tests/run.sh
      - name: Installer tests
        run: sh tests/install.sh
      - name: Build, sign and notarize
        timeout-minutes: 45
        env:
          RHUN_NOTARIZE: '1'
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          RHUN_NOTARY_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          RHUN_NOTARY_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          : "${APPLE_API_KEY_P8:?missing APPLE_API_KEY_P8 secret}"
          : "${RHUN_NOTARY_KEY_ID:?missing APPLE_API_KEY_ID secret}"
          : "${RHUN_NOTARY_ISSUER:?missing APPLE_API_ISSUER_ID secret}"
          export RHUN_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$RHUN_NOTARY_KEY"' EXIT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RHUN_NOTARY_KEY"
          RHUN_DIST=1 tools/package-mac.sh
      - name: Verify packaged Mac downloads
        run: |
          v=$(cat VERSION)
          tools/verify-mac-release.sh "build/rhun-$v-macos-arm64.zip" "build/rhun-$v-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            build/rhun-*-macos-arm64.zip
            build/rhun-*-macos-arm64.dmg
          if-no-files-found: error
      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/rhun.keychain-db" 2>/dev/null || true

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag is VERSION
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME.Substring(1) -ne (Get-Content VERSION -Raw).Trim()) { exit 1 }
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: build/llvm
          key: llvm-windows-x64-23.1.2
      - name: LLVM
        shell: pwsh
        timeout-minutes: 20
        run: tools/setup-windows-llvm.ps1
      - uses: actions/cache/save@v4
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          path: build/llvm
          key: llvm-windows-x64-23.1.2
      - name: Build
        env:
          RHUN_DIST: '1'
        id: build
        run: python tools/build-windows.py test
      - name: Native tests
        run: python tests/windows.py
      # SignPath signs both executables once SIGNPATH_ORGANIZATION_ID is set (docs/windows-signing.md);
      # the release waits for its manual approval there, and everything after ships the signed files.
      - name: Version
        id: version
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: Add-Content $env:GITHUB_OUTPUT "version=$((Get-Content VERSION -Raw).Trim())"
      - name: Unsigned executables
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            build/windows/rhun.exe
            build/windows/rhun.com
          if-no-files-found: error
      - name: Sign
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: rhun
          signing-policy-slug: release-signing
          artifact-configuration-slug: windows-executables
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 14400
          output-artifact-directory: build/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}
      - name: Signed executables
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          foreach ($name in 'rhun.exe', 'rhun.com') {
            $signature = Get-AuthenticodeSignature -LiteralPath "build/signed/$name"
            if ($signature.Status -ne 'Valid') { throw "$name is not validly signed: $($signature.StatusMessage)" }
            Write-Output "$name signed by $($signature.SignerCertificate.Subject)"
            Copy-Item -LiteralPath "build/signed/$name" -Destination build/windows -Force
          }
      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/package-windows.py
      - name: Installer tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python tests/windows-install.py
      - name: Updater tests
        env:
          RHUN_DIST: '1'
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python tests/windows-update.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/rhun-*-windows-x86_64.zip
          if-no-files-found: error

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums, version and installer
        run: |
          v=$(cat VERSION)
          test -s "dist/rhun-$v-linux-x86_64.tar.gz"
          test -s "dist/rhun-$v-macos-arm64.zip"
          test -s "dist/rhun-$v-macos-arm64.dmg"
          test -s "dist/rhun-$v-windows-x86_64.zip"
          cp install.sh install.ps1 dist/
          cat VERSION > dist/VERSION
          (cd dist && sha256sum rhun-* > SHA256SUMS && cat SHA256SUMS)
      - name: Release notes
        env:
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --format='- %s' ${prev:+"$prev.."}"$GITHUB_REF_NAME" > notes.md
          if [ "$SIGNED" = true ]; then
            printf '\nWindows: free code signing provided by SignPath.io, certificate by SignPath Foundation. [Code signing policy](https://rhun.app/code-signing/)\n' >> notes.md
          fi
          cat notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          pre=
          case $v in *-*) pre=--prerelease ;; esac
          # shellcheck disable=SC2086 # pre is empty or one flag
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "rhun $v" --notes-file notes.md $pre dist/*
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # winget (docs/windows-signing.md): a pull request to microsoft/winget-pkgs for each release,
  # from WINGET_TOKEN's fork of it (a classic token with public_repo). Prereleases stay off winget.
  winget:
    needs: publish
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Submit to winget
        env:
          GH_TOKEN: ${{ github.token }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if [ -z "$WINGET_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set: nothing submitted to winget"
            exit 0
          fi
          v=$(cat VERSION)
          # the published ZIP, so the manifest's hash is the download's
          gh release download "$GITHUB_REF_NAME" --pattern "rhun-$v-windows-x86_64.zip" --dir build
          manifests=$(python3 tools/winget-manifests.py "build/rhun-$v-windows-x86_64.zip" build/winget)
          cat "$manifests"/*.yaml
          curl -fsSL -o build/komac.tar.gz https://github.com/russellbanks/Komac/releases/download/v2.17.1/komac-2.17.1-x86_64-unknown-linux-gnu.tar.gz
          echo 'e694e79cd451afabf47bead66ed34586fef4814f7b94e4b61a098f419978d5d7  build/komac.tar.gz' | sha256sum -c -
          tar -xzf build/komac.tar.gz -C build komac
          GITHUB_TOKEN=$WINGET_TOKEN build/komac submit "$manifests" --yes
