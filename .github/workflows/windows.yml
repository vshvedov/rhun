name: windows

on:
  push:
    branches: [main, 'feat/windows*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: build/llvm
          key: llvm-windows-x64-23.1.2
      - name: LLVM
        shell: pwsh
        timeout-minutes: 20
        run: tools/setup-windows-llvm.ps1
      - uses: actions/cache/save@v4
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        with:
          path: build/llvm
          key: llvm-windows-x64-23.1.2
      - name: Build
        id: build
        run: python tools/build-windows.py test
      - name: Defender verdict tests
        shell: pwsh
        run: tests/windows-defender.ps1
      - name: Defender binary scan
        shell: pwsh
        timeout-minutes: 10
        run: tools/scan-windows.ps1 -Path build/windows/rhun.exe,build/windows/rhun.com -ConfigureRunner -ReportDir build/defender/binaries
      - name: Native tests
        run: python tests/windows.py
      - name: Package
        id: package
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python tools/package-windows.py
      - name: Defender archive scan
        shell: pwsh
        timeout-minutes: 10
        run: |
          $archive = (Get-ChildItem build/windows/rhun-*-windows-x86_64.zip).FullName
          tools/scan-windows.ps1 -Path $archive -UseCurrentSignatures -ReportDir build/defender/archive
      - name: Installer tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python tests/windows-install.py
      - name: Updater tests
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: python tests/windows-update.py
      - name: Defender runtime evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/defender | Out-Null
          Get-MpThreat | Select-Object ThreatID, ThreatName, IsActive | ConvertTo-Json -Depth 5 | Set-Content build/defender/threats.json
          Get-MpThreatDetection | Select-Object InitialDetectionTime, LastThreatStatusChangeTime, ThreatID, Resources, ProcessName, ActionSuccess | ConvertTo-Json -Depth 5 | Set-Content build/defender/runtime-detections.json
          Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-Windows Defender/Operational'; StartTime=(Get-Date).AddHours(-1); Id=1116,1117,1121,1122} -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, Message | ConvertTo-Json -Depth 5 | Set-Content build/defender/runtime-events.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-defender
          path: build/defender
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: build/windows/rhun-*-windows-x86_64.zip
          if-no-files-found: error
