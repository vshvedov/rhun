# An extension without debuggers of its own that starts the fake debugger extension's
# ([needs] debuggers), as the Tests extension starts the Debug extension's Delve: tests/debug-feature.py
name = debuguser
owner = rhun-tests
title = Debug User
description = Starts another extension's debugger, for the host tests.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../debugfake.py
on = command

[needs]
debug = yes
debuggers = fake nosuch

[commands]
start = Debug User: Start
