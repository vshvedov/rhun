# The echo extension, for the host tests. See tests/ext/echo.py.
name = echo
owner = rhun-tests
title = Echo
description = A test extension that echoes what rhun tells it.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../echo.py
on = command

[commands]
shout = Shout | ctrl+alt+shift+u
hi = Say Hi
toast = Echo Toast
stale = Stale Edit
status = Echo Status
open = Echo Open
bad = Bad Range
mb = Multibyte Range
sel = Select Word
relopen = Relative Open
diag = Diagnostics
nodiag = Clear Diagnostics
baddiag = Bad Diagnostics
stalediag = Stale Diagnostics
reg = Register a Command
opt = Set Options
optoff = Unset Options
optsave = Save Options
badopt = Bad Option
choose = Choose
ask = Ask
term = Terminal Command
cmd = Run a Command
badcmd = Run a Forbidden Command
die = Exit
termcmd = Terminal Command Via Cmd
emptymark = Empty Mark
countdiag = Miscounted Diagnostics
bidi = Bidi Term
first = Replace the First Byte
pwrite = Probe Project Write
hread = Probe Home Read
swrite = Probe State Write
net = Probe Network
exec = Probe Exec
greet = Greet
view = Open a View
badview = Draw a Broken Picture
unview = Close the View
manyviews = Open Nine Views
staleview = Unview Without a Number
faredit = Edit Far From the Cursor
apply = Apply a workspace edit
applystale = Apply a stale workspace edit
applyoverlap = Apply overlapping edits

[settings]
greeting.type = string
greeting.default = Hello
greeting.title = Greeting
greeting.description = What echo.greet inserts
loud.type = bool
loud.title = Loud
width.type = int
width.default = 4
width.min = 1
width.max = 8
style.type = choice
style.options = plain fancy
style.default = plain

[subscribe]
opened = *
saved = *
changed = *
cursor = *
hover = *

[needs]
documents = write
terminal = yes
project = read

[provides]
complete = *.rs
complete.triggers = . :
signature = *.rs
signature.triggers = ( ,
definition = *.rs
references = *.rs
symbols = *.rs
actions = *.rs
rename = *.rs
format = *.rs
