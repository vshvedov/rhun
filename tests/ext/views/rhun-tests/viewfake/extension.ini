# The viewfake extension, for the retained-view tests. See tests/ext/viewfake.py.
name = viewfake
owner = rhun-tests
title = View Fake
description = A test extension with retained views.
version = 0.0.1
protocol = 1
runtime = python3
run = ../../../viewfake.py
on = command

[commands]
rescan = Rescan
renamed = Rescan With New Ids
vanish = Remove the Selected Node
badpatch = Bad Patch
big = Too Many Nodes
show = Show Items
empty = Empty State
msg = Set a Message
busy = Busy
expand = Expand Main
reveal = Reveal lib.rs's TODO
multi = Multi-select Items
delpin = Remove the Pin Action
log = Log Lines
logmany = Log Many Lines
logclear = Clear the Log
tab = Open a Tab
untab = Close the Tab
loadthen = Loading Then Children
clearmain = Clear Main's Children
note = Note
noteask = Note With Buttons
noteerr = Error Note
notemany = Six Notes
notes17 = Seventeen Notes
noteset = Change the Last Note
unnote = Close the Last Note
prog = Progress in the Status Bar
prognote = Progress in a Card
progview = Progress in TODO
progbad = Bad Progress
progend = End the Last Progress
img = Image
badimg = Bad Image
imgs65 = Sixty-five Images
unimg = Unimage Twice
tabpic = Picture Tab
readd = Remove and Add Alpha
actswap = One Action Thirty Times
fatsame = Two Sets of One Node
revealmulti = Reveal in a Multi-select Tree
noteclose1 = Close the First Note
prognote2 = Progress Without Cancel
pictitle = Title the Picture
bigunimage = Unimage a Huge Handle
formmsg = Form Message
formold = Form Value for an Old Edit
formnew = Form Value for the Last Edit
formbad = Bad Form Record
formless = Form With One Field
formmany = Form Replaced by 200 Others
formgrow = Form 195 New Fields
formdup = Form Key Twice
formsame = Form One New Key 195 Times
formwrap = Form Wrapping Lengths
formrev = Form Reversed
formdisable = Form Name Disabled
fatset = Seven Big Sets
fatrelist = Big Lists Twice
tbsorted = Table Sorted by Its Owner
tbmore = Table With More Rows
tbadd = Table Row Added
tbbad = Table Bad Columns
tbtree = Columns on a Tree
quick = Quick Pick
quickmulti = Quick Multi-select
quickinput = Quick Password
quicknofilter = Quick Without Filter
quickclose = Close the Quick Input
quickbad = Bad Quick Input
quickbig = Too Many Quick Items
quickactive = Quick Active Item
quickmany = Quick Thirty Items
docfollow = Doc Following long.md
docbad = Doc Relative Base
docbig = Doc Too Big
doctree = Tree Op on the Doc
docimg = Doc With an Image Handle
doccopy = Doc With Copyable Code
notemd = Markdown Note

[needs]
project = read

# manifest menus drawn by the views (contributions' menu.s)
[menu.view_title]
again.command = rescan
again.when = view == rhun-tests/viewfake.todo
[menu.view_item]
newids.command = renamed
newids.when = viewItem == file
[menu.view_item_inline]
showitems.command = show
showitems.when = viewItem == file

[views]
todo.title = TODO
todo.place = sidebar
todo.kind = tree
todo.open = yes
items.title = Items
items.place = panel
items.kind = tree
# a log (with view-log agreed; VIEWFAKE_NOLOG: shown as not supported)
logs.title = Logs
logs.place = side
logs.kind = log
# a picture (12a's draw and events): with VIEWFAKE_PIC
pic.title = Picture
pic.place = panel
pic.kind = picture
# a form: with VIEWFAKE_FORM
setup.title = Setup
setup.place = panel
setup.kind = form
# a table: with VIEWFAKE_TABLE
files.title = Files
files.place = panel
files.kind = table
# a doc: with VIEWFAKE_DOC
readme.title = Readme
readme.place = side
readme.kind = doc
# left out: no title, unknown place, unknown kind
notitle.place = panel
notitle.kind = tree
badplace.title = Bad
badplace.place = nowhere
badplace.kind = tree
badkind.title = Bad
badkind.place = panel
badkind.kind = graph
